name: CI - userservice

on:
  push:
    branches: [ main, develop, userservice/cicd ]
    paths:
      - 'techhub/userservice/**'

  pull_request:
    branches: [ main ]
    paths:
      - 'techhub/userservice/**'

jobs:
  build:
    name: Build & Test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: techhub/userservice

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'maven'

      - name: Build with Maven
        run: mvn clean compile -B

      - name: Run tests
        run: mvn test -B
