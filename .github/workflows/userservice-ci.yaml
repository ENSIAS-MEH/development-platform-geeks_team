name: User Service CI/CD

on:
  push:
    branches: [main]
    paths:
      - 'techhub/userservice/**'
  pull_request:
    branches: [main]
    paths:
      - 'techhub/userservice/**'

env:
  SERVICE_DIR: techhub/userservice

jobs:
  # ─── Job 1: Build ────────────────────────────────────────────
  build:
    name: Build & Package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Build
        working-directory: ${{ env.SERVICE_DIR }}
        run: mvn clean package -DskipTests -B

      - name: Upload JAR
        uses: actions/upload-artifact@v4
        with:
          name: user-service-jar
          path: ${{ env.SERVICE_DIR }}/target/*.jar
          retention-days: 7

  # ─── Job 2: Docker Build & Push ──────────────────────────────
  docker:
    name: Docker Build & Push
    runs-on: ubuntu-latest
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME_ALAE }}
          password: ${{ secrets.DOCKERHUB_TOKEN_ALAE }}

      - name: Build and push image
        working-directory: ${{ env.SERVICE_DIR }}
        run: |
          docker build \
            -t ${{ secrets.DOCKERHUB_USERNAME_ALAE }}/userservice:${{ github.sha }} \
            -t ${{ secrets.DOCKERHUB_USERNAME_ALAE }}/userservice:latest \
            .
          docker push ${{ secrets.DOCKERHUB_USERNAME_ALAE }}/userservice:${{ github.sha }}
          docker push ${{ secrets.DOCKERHUB_USERNAME_ALAE }}/userservice:latest

      - name: Update image tag in deployment.yaml
        run: |
          sed -i 's|image: ${{ secrets.DOCKERHUB_USERNAME_ALAE }}/userservice:.*|image: ${{ secrets.DOCKERHUB_USERNAME_ALAE }}/userservice:${{ github.sha }}|' techhub/userservice/k8s/deployment.yaml
          git config user.email "ci@techhub.com"
          git config user.name "GitHub Actions"
          git add techhub/userservice/k8s/deployment.yaml
          git diff --staged --quiet || git commit -m "ci: update userservice image to ${{ github.sha }}"
          git push