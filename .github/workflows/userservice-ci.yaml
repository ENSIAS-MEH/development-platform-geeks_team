# ═══════════════════════════════════════════════════════════════
#  User Service – GitHub Actions CI/CD Pipeline
#  Trigger: push/PR to main on user service paths
# ═══════════════════════════════════════════════════════════════

name: User Service CI/CD

on:
  push:
    branches: [main, develop, userservice/cicd]
    paths:
      - 'techhub/userservice/**'
  pull_request:
    branches: [main]
    paths:
      - 'techhub/userservice/**'

env:
  SERVICE_DIR: techhub/userservice
  ARTIFACT_NAME: user-service-jar

jobs:
  # ─── Job 1: Build & Package ──────────────────────────────────
  build:
    name: Build & Package
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 21 (Temurin)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Compile
        working-directory: ${{ env.SERVICE_DIR }}
        run: mvn clean compile -B

      - name: Package (skip tests)
        working-directory: ${{ env.SERVICE_DIR }}
        run: mvn package -DskipTests -B

      - name: Upload JAR artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.ARTIFACT_NAME }}
          path: ${{ env.SERVICE_DIR }}/target/*.jar
          retention-days: 7

  # ─── Job 2: Docker Build & Push ─────────────────────────────
  docker-build-push:
    name: Docker Build & Push
    runs-on: ubuntu-latest
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Download JAR artifact
        uses: actions/download-artifact@v4
        with:
          name: ${{ env.ARTIFACT_NAME }}
          path: ${{ env.SERVICE_DIR }}/target/

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME_ALAE }}
          password: ${{ secrets.DOCKERHUB_TOKEN_ALAE }}

      - name: Build Docker image
        working-directory: ${{ env.SERVICE_DIR }}
        run: |
          docker build \
            -t ${{ secrets.DOCKERHUB_USERNAME_ALAE }}/userservice:${{ github.sha }} \
            -t ${{ secrets.DOCKERHUB_USERNAME_ALAE }}/userservice:latest \
            .

      - name: Push Docker image
        run: |
          docker push ${{ secrets.DOCKERHUB_USERNAME_ALAE }}/userservice:${{ github.sha }}
          docker push ${{ secrets.DOCKERHUB_USERNAME_ALAE }}/userservice:latest

  # ─── Job 3: Deploy to Kubernetes ────────────────────────────
  deploy:
    name: Deploy to Kubernetes
    runs-on: ubuntu-latest
    needs: docker-build-push
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    steps:
      - name: Set up kubectl
        uses: azure/setup-kubectl@v3
        with:
          version: 'latest'

      - name: Configure kubeconfig
        run: |
          mkdir -p $HOME/.kube
          echo "${{ secrets.KUBECONFIG }}" | base64 -d > $HOME/.kube/config

      - name: Update deployment image
        run: |
          kubectl set image deployment/userservice \
            userservice=${{ secrets.DOCKERHUB_USERNAME_ALAE }}/userservice:${{ github.sha }} \
            -n techhub

      - name: Wait for rollout
        run: |
          kubectl rollout status deployment/userservice \
            -n techhub \
            --timeout=300s
