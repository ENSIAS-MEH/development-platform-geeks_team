name: Event Service CI/CD

on:
  push:
    branches: [main]
    paths:
      - 'techhub/event-service/**'
      - '.github/workflows/event-service-ci.yml'
  pull_request:
    branches: [main]
    paths:
      - 'techhub/event-service/**'

concurrency:
  group: event-service-${{ github.ref }}
  cancel-in-progress: true

jobs:

  test:
    name: Build & Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: temurin
          cache: maven

      - name: Build and test
        working-directory: techhub/event-service
        run: mvn clean test -B

  build-and-push:
    name: Build & Push Image
    needs: test
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'

    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Lowercase image owner
        run: |
          echo "IMAGE=ghcr.io/$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')/event-service" >> $GITHUB_ENV

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=sha,prefix=sha-,format=short
            type=raw,value=latest,enable=true
          labels: |
            org.opencontainers.image.title=event-service
            org.opencontainers.image.description=TechHub Event Service
            org.opencontainers.image.vendor=TechHub

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: techhub/event-service
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
