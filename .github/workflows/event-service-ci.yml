name: Event Service CI/CD

on:
  push:
    branches:
      - main
    paths:
      - 'Desktop/Projet plateforme/services/event-service/**'
  pull_request:
    branches:
      - main
    paths:
      - 'Desktop/Projet plateforme/services/event-service/**'

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'maven'

      - name: Build and Test with Maven
        run: |
          cd "Desktop/Projet plateforme/services/event-service"
          mvn clean test

      - name: Build Docker Image
        run: |
          cd "Desktop/Projet plateforme/services/event-service"
          docker build -t devconnect/event-service:${{ github.sha }} .

      # Push image and deployment manifest updates would go here in actual environment
