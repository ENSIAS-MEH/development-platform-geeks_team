# ═══════════════════════════════════════════════════════════════
#  Community Service – GitHub Actions CI/CD Pipeline
#  Trigger: push/PR to main on community service paths
# ═══════════════════════════════════════════════════════════════

name: Community Service CI/CD

on:
  push:
    branches: [main]
    paths:
      - 'techhub/communityservice/**'
  pull_request:
    branches: [main]
    paths:
      - 'techhub/communityservice/**'

env:
  SERVICE_DIR: techhub/communityservice
  ARTIFACT_NAME: community-service-jar

jobs:
  # ─── Job 1: Build & Test ──────────────────────────────────────
  build-and-test:
    name: Build & Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Java 17 (Temurin)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Run tests
        working-directory: ${{ env.SERVICE_DIR }}
        run: mvn test -B

      - name: Package (skip tests)
        working-directory: ${{ env.SERVICE_DIR }}
        run: mvn package -DskipTests -B

      - name: Upload JAR artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.ARTIFACT_NAME }}
          path: ${{ env.SERVICE_DIR }}/target/community-service-*.jar
          retention-days: 7

  # ─── Job 2: Docker Build & Push ───────────────────────────────
  docker-build-push:
    name: Docker Build & Push
    runs-on: ubuntu-latest
    needs: build-and-test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Download JAR artifact
        uses: actions/download-artifact@v4
        with:
          name: ${{ env.ARTIFACT_NAME }}
          path: ${{ env.SERVICE_DIR }}/target/

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build Docker image
        working-directory: ${{ env.SERVICE_DIR }}
        run: |
          docker build \
            -t ${{ secrets.DOCKERHUB_USERNAME }}/community-service:${{ github.sha }} \
            -t ${{ secrets.DOCKERHUB_USERNAME }}/community-service:latest \
            .

      - name: Push Docker image
        run: |
          docker push ${{ secrets.DOCKERHUB_USERNAME }}/community-service:${{ github.sha }}
          docker push ${{ secrets.DOCKERHUB_USERNAME }}/community-service:latest

  # ─── Job 3: Update K8s Manifest for ArgoCD (GitOps) ───────────
  deploy:
    name: Update K8s Manifest
    runs-on: ubuntu-latest
    needs: docker-build-push
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Update deployment.yaml
        working-directory: ${{ env.SERVICE_DIR }}
        run: |
          # Replace the image tag in deployment.yaml
          sed -i "s|image: .*|image: ${{ secrets.DOCKERHUB_USERNAME }}/community-service:${{ github.sha }}|g" k8s/deployment.yaml
          
          # Commit and push changes
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add k8s/deployment.yaml
          git commit -m "chore(gitops): update community-service image to ${{ github.sha }} [skip ci]" || echo "No changes to commit"
          git push
