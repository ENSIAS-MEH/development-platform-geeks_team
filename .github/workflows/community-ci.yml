# ═══════════════════════════════════════════════════════════════
#  Community Service – GitHub Actions CI/CD Pipeline
#  Trigger: push/PR to main on community service paths
# ═══════════════════════════════════════════════════════════════

name: Community Service CI/CD

on:
  push:
    branches: [main]
    paths:
      - 'techhub/communityservice/**'
  pull_request:
    branches: [main]
    paths:
      - 'techhub/communityservice/**'

env:
  SERVICE_DIR: techhub/communityservice
  ARTIFACT_NAME: community-service-jar

jobs:
  # ─── Job 1: Build & Test ──────────────────────────────────────
  build-and-test:
    name: Build & Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Java 17 (Temurin)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Run tests
        working-directory: ${{ env.SERVICE_DIR }}
        run: mvn test -B

      - name: Package (skip tests)
        working-directory: ${{ env.SERVICE_DIR }}
        run: mvn package -DskipTests -B

      - name: Upload JAR artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.ARTIFACT_NAME }}
          path: ${{ env.SERVICE_DIR }}/target/community-service-*.jar
          retention-days: 7

  # ─── Job 2: Docker Build & Push ───────────────────────────────
  docker-build-push:
    name: Docker Build & Push
    runs-on: ubuntu-latest
    needs: build-and-test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Download JAR artifact
        uses: actions/download-artifact@v4
        with:
          name: ${{ env.ARTIFACT_NAME }}
          path: ${{ env.SERVICE_DIR }}/target/

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build Docker image
        working-directory: ${{ env.SERVICE_DIR }}
        run: |
          docker build \
            -t ${{ secrets.DOCKERHUB_USERNAME }}/community-service:${{ github.sha }} \
            -t ${{ secrets.DOCKERHUB_USERNAME }}/community-service:latest \
            .

      - name: Push Docker image
        run: |
          docker push ${{ secrets.DOCKERHUB_USERNAME }}/community-service:${{ github.sha }}
          docker push ${{ secrets.DOCKERHUB_USERNAME }}/community-service:latest

  # ─── Job 3: Deploy to Kubernetes ──────────────────────────────
  deploy:
    name: Deploy to Kubernetes
    runs-on: ubuntu-latest
    needs: docker-build-push
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    steps:
      - name: Set up kubectl
        uses: azure/setup-kubectl@v3
        with:
          version: 'latest'

      - name: Configure kubeconfig
        run: |
          mkdir -p $HOME/.kube
          echo "${{ secrets.KUBECONFIG }}" | base64 -d > $HOME/.kube/config

      - name: Update deployment image
        run: |
          kubectl set image deployment/community-service \
            community-service=${{ secrets.DOCKERHUB_USERNAME }}/community-service:${{ github.sha }} \
            -n techhub

      - name: Wait for rollout
        run: |
          kubectl rollout status deployment/community-service \
            -n techhub \
            --timeout=300s
