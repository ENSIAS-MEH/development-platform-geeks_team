name: team-service CI/CD

# ── Triggers ──────────────────────────────────────────────────────────────────
on:
  push:
    branches: [main]
    paths:
      - 'techhub/team-service/**'
      - '.github/workflows/team-service-ci.yml'
  pull_request:
    branches: [main]
    paths:
      - 'techhub/team-service/**'

# ── Concurrency — cancel in-flight runs on the same branch/PR ─────────────────
concurrency:
  group: team-service-${{ github.ref }}
  cancel-in-progress: true

# ── Jobs ──────────────────────────────────────────────────────────────────────
jobs:

  # ── Job 1: Test ─────────────────────────────────────────────────────────────
  test:
    name: Test & Coverage
    runs-on: ubuntu-latest
    # No service sidecars needed: application-test.yml uses H2, excludes Redis
    # auto-config, and Kafka uses @EmbeddedKafka via spring-kafka-test.

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: temurin
          # Caches ~/.m2/repository — cuts dependency download from ~3min → ~15s
          cache: maven

      - name: Run tests + Jacoco coverage gate (80% line)
        working-directory: techhub/team-service
        # mvn verify runs: compile → test → package → jacoco:check
        # The "test" profile activates application-test.yml which is fully
        # self-contained (H2, embedded Kafka, Redis excluded, own JWT secret).
        run: mvn verify -B
        env:
          SPRING_PROFILES_ACTIVE: test

      - name: Upload Jacoco report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jacoco-report
          path: techhub/team-service/target/site/jacoco/
          retention-days: 7

  # ── Job 2: Build & Push (main branch only) ───────────────────────────────────
  build-and-push:
    name: Build & Push Image
    needs: test
    runs-on: ubuntu-latest
    # Only publish on merge to main — not on PRs
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'

    permissions:
      contents: read
      packages: write   # required to push to GHCR

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Lowercase image owner (Docker requires lowercase)
        run: |
          echo "IMAGE=ghcr.io/$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')/team-service" >> $GITHUB_ENV

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          tags: |
            # Immutable per-commit tag: sha-a1b2c3d
            type=sha,prefix=sha-,format=short
            # Mutable latest tag — only on main
            type=raw,value=latest,enable=true
          labels: |
            org.opencontainers.image.title=team-service
            org.opencontainers.image.description=TechHub Team Service
            org.opencontainers.image.vendor=TechHub

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: techhub/team-service
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # GitHub Actions cache — layer cache persists across runs
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Summary
        run: |
          echo "### Image published 🚀" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Tag | Value |" >> $GITHUB_STEP_SUMMARY
          echo "|---|---|" >> $GITHUB_STEP_SUMMARY
          echo "| SHA tag | \`${{ env.IMAGE }}:sha-$(git rev-parse --short HEAD)\` |" >> $GITHUB_STEP_SUMMARY
          echo "| Latest  | \`${{ env.IMAGE }}:latest\` |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Pull with:" >> $GITHUB_STEP_SUMMARY
          echo "\`\`\`" >> $GITHUB_STEP_SUMMARY
          echo "docker pull ${{ env.IMAGE }}:sha-$(git rev-parse --short HEAD)" >> $GITHUB_STEP_SUMMARY
          echo "\`\`\`" >> $GITHUB_STEP_SUMMARY
