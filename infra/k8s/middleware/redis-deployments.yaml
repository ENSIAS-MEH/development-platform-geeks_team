apiVersion: apps/v1
kind: Deployment
metadata:
  name: project-redis
  namespace: devconnect
  labels:
    app: project-redis
spec:
  replicas: 1
  selector:
    matchLabels:
      app: project-redis
  template:
    metadata:
      labels:
        app: project-redis
    spec:
      containers:
        - name: redis
          image: redis:7-alpine
          ports:
            - containerPort: 6379
---
apiVersion: v1
kind: Service
metadata:
  name: project-redis
  namespace: devconnect
spec:
  ports:
    - port: 6379
      targetPort: 6379
  selector:
    app: project-redis
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: event-redis
  namespace: devconnect
  labels:
    app: event-redis
spec:
  replicas: 1
  selector:
    matchLabels:
      app: event-redis
  template:
    metadata:
      labels:
        app: event-redis
    spec:
      containers:
        - name: redis
          image: redis:7-alpine
          ports:
            - containerPort: 6379
---
apiVersion: v1
kind: Service
metadata:
  name: event-redis
  namespace: devconnect
spec:
  ports:
    - port: 6379
      targetPort: 6379
  selector:
    app: event-redis
