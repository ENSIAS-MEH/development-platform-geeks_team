apiVersion: apps/v1
kind: Deployment
metadata:
  name: loki
  namespace: devconnect
  labels:
    app: loki
spec:
  replicas: 1
  selector:
    matchLabels:
      app: loki
  template:
    metadata:
      labels:
        app: loki
    spec:
      containers:
        - name: loki
          image: grafana/loki:2.8.2
          ports:
            - containerPort: 3100
          args:
            - "-config.file=/etc/loki/local-config.yaml"
---
apiVersion: v1
kind: Service
metadata:
  name: loki
  namespace: devconnect
spec:
  ports:
    - port: 3100
      targetPort: 3100
      name: http
  selector:
    app: loki
  type: ClusterIP
