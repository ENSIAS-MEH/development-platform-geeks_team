apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: project-service
  namespace: argocd
spec:
  project: default
  source:
    repoURL: 'https://github.com/your-username/development-platform-geeks_team.git'
    targetRevision: HEAD
    path: techhub/project-service/k8s
  destination:
    server: 'https://kubernetes.default.svc'
    namespace: devconnect
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
