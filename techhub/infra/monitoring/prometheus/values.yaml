# ═══════════════════════════════════════════════════════════════
#  Prometheus Helm Chart values – Community Service scrape config
#  Used with: helm install prometheus prometheus-community/prometheus
# ═══════════════════════════════════════════════════════════════

# Override default Prometheus values for TechHub
alertmanager:
  enabled: true

server:
  retention: "15d"
  persistentVolume:
    enabled: true
    size: 10Gi

# Additional scrape configuration for community-service
extraScrapeConfigs: |
  - job_name: 'community-service'
    metrics_path: '/actuator/prometheus'
    scrape_interval: 15s
    scrape_timeout: 10s
    static_configs:
      - targets: ['community-service.techhub.svc.cluster.local:8084']
        labels:
          application: 'community-service'
          namespace: 'techhub'
    kubernetes_sd_configs:
      - role: endpoints
        namespaces:
          names:
            - techhub
    relabel_configs:
      - source_labels: [__meta_kubernetes_service_name]
        regex: community-service
        action: keep
      - source_labels: [__meta_kubernetes_namespace]
        target_label: namespace
      - source_labels: [__meta_kubernetes_service_name]
        target_label: service
