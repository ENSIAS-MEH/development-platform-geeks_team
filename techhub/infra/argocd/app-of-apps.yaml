apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: techhub-app-of-apps
  namespace: argocd
spec:
  project: default
  source:
    repoURL: 'https://github.com/your-username/development-platform-geeks_team.git'
    targetRevision: HEAD
    path: techhub/infra/argocd
  destination:
    server: 'https://kubernetes.default.svc'
    namespace: argocd
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
