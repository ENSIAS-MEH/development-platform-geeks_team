# ═══════════════════════════════════════════════════════════════
#  Community Service – ArgoCD Application
#  GitOps-driven deployment with automated sync
# ═══════════════════════════════════════════════════════════════
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: community-service
  namespace: argocd
  labels:
    app.kubernetes.io/part-of: techhub

spec:
  project: default

  source:
    # Replace REPO_URL with your actual Git repository URL
    repoURL: REPO_URL
    path: techhub/communityservice/k8s
    targetRevision: main

  destination:
    server: https://kubernetes.default.svc
    namespace: techhub

  syncPolicy:
    automated:
      prune: true        # Delete resources removed from Git
      selfHeal: true      # Auto-fix drift from desired state
    syncOptions:
      - CreateNamespace=true
      - PruneLast=true
