apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: shared-infra
  namespace: argocd
spec:
  project: default
  source:
    repoURL: 'https://github.com/your-username/development-platform-geeks_team.git'
    targetRevision: HEAD
    path: techhub/infra/k8s
  destination:
    server: 'https://kubernetes.default.svc'
    namespace: techhub
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
