version: '3.9'

networks:
  techhub-network:
    driver: bridge

volumes:
  postgres-data:
  redis-data:

services:

  # ── Infrastructure ────────────────────────────────────────────────

  postgres:
    image: postgres:16-alpine
    container_name: techhub-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./infra/postgres-init.sql:/docker-entrypoint-initdb.d/init.sql
    networks:
      - techhub-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: techhub-redis
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    command: redis-server --save 60 1 --loglevel warning
    networks:
      - techhub-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 3

  zookeeper:
    image: confluentinc/cp-zookeeper:7.6.1
    container_name: techhub-zookeeper
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    networks:
      - techhub-network

  kafka:
    image: confluentinc/cp-kafka:7.6.1
    container_name: techhub-kafka
    depends_on:
      - zookeeper
    ports:
      - "9092:9092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092,PLAINTEXT_HOST://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092,PLAINTEXT_HOST://0.0.0.0:29092
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
    networks:
      - techhub-network
    healthcheck:
      test: ["CMD", "kafka-topics", "--bootstrap-server", "localhost:9092", "--list"]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 30s

  # Dev SMTP — catches all emails, view at http://localhost:8025
  mailhog:
    image: mailhog/mailhog:v1.0.1
    container_name: techhub-mailhog
    ports:
      - "1025:1025"
      - "8025:8025"
    networks:
      - techhub-network

  # ── Services ──────────────────────────────────────────────────────

  userservice:
    build:
      context: ./userservice
      dockerfile: Dockerfile
    container_name: techhub-userservice
    ports:
      - "8080:8080"
    environment:
      DB_PASSWORD: postgres
      JWT_SECRET: 0123456789ABCDEF0123456789ABCDEF0123456789ABCDEF0123456789ABCDEF
      CLIENT_ID: dev-github-client-id
      CLIENT_SECRET: dev-github-client-secret
      GOOGLE_CLIENT_ID: dev-google-client-id
      GOOGLE_CLIENT_SECRET: dev-google-client-secret
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      kafka:
        condition: service_healthy
    networks:
      - techhub-network

  event-service:
    build:
      context: ./event-service
      dockerfile: Dockerfile
    container_name: techhub-event-service
    ports:
      - "8082:8082"
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: event_db
      DB_USERNAME: postgres
      DB_PASSWORD: postgres
      REDIS_HOST: redis
      REDIS_PORT: 6379
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      kafka:
        condition: service_healthy
    networks:
      - techhub-network

  communityservice:
    build:
      context: ./communityservice
      dockerfile: Dockerfile
    container_name: techhub-communityservice
    ports:
      - "8085:8084"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/community_db
      SPRING_DATASOURCE_USERNAME: postgres
      DB_PASSWORD: postgres
      SPRING_DATA_REDIS_HOST: redis
      SPRING_DATA_REDIS_PORT: 6379
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:9092
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      kafka:
        condition: service_healthy
    networks:
      - techhub-network

  notification-service:
    build:
      context: ./notification-service
      dockerfile: Dockerfile
    container_name: techhub-notification-service
    ports:
      - "8086:8086"
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/notification_db
      DB_USERNAME: postgres
      DB_PASSWORD: postgres
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      KAFKA_CONSUMER_GROUP_ID: notification-group
      KAFKA_TOPIC_USER_REGISTERED: user-registered
      KAFKA_TOPIC_USER_PASSWORD_CHANGED: user-password-changed
      KAFKA_TOPIC_TEAM_INVITED: team-invited
      KAFKA_TOPIC_TEAM_JOINED: team-joined
      SPRING_PROFILES_ACTIVE: docker
      MAIL_HOST: mailhog
      MAIL_PORT: 1025
      MAIL_FROM: noreply@techhub.dev
      MAIL_USERNAME: ""
      MAIL_PASSWORD: ""
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy
    networks:
      - techhub-network

  project-service:
    build:
      context: ./project-service
      dockerfile: Dockerfile
    container_name: techhub-project-service
    ports:
      - "8084:8083"
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: project_db
      DB_USERNAME: postgres
      DB_PASSWORD: postgres
      REDIS_HOST: redis
      REDIS_PORT: 6379
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      kafka:
        condition: service_healthy
    networks:
      - techhub-network

  team-service:
    build:
      context: ./team-service
      dockerfile: Dockerfile
    container_name: techhub-team-service
    ports:
      - "8083:8083"
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: team_db
      DB_USERNAME: postgres
      DB_PASSWORD: postgres
      REDIS_HOST: redis
      REDIS_PORT: 6379
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      JWT_SECRET: 0123456789ABCDEF0123456789ABCDEF0123456789ABCDEF0123456789ABCDEF
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      kafka:
        condition: service_healthy
    networks:
      - techhub-network
