# ═══════════════════════════════════════════════════════════════════
#  GitHub Actions — Team Service CI/CD Pipeline
#  Governance: doc 02 §12
#  Owner: Member 3
#  Triggers: push to feature/* and develop branches
# ═══════════════════════════════════════════════════════════════════

name: Team Service — Build & Push

on:
  push:
    branches:
      - "feature/**"
      - develop
    paths:
      - "team-service/**"        # Only run when team-service code changes
      - ".github/workflows/team-service.yml"
  pull_request:
    branches: [develop]
    paths:
      - "team-service/**"

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository_owner }}/techhub/team-service

jobs:

  # ─────────────────────────────────────────────────────────────────
  # JOB 1 — Build, test, and verify code quality
  # ─────────────────────────────────────────────────────────────────
  build-and-test:
    name: Build & Test
    runs-on: ubuntu-latest

    services:
      # Spin up a real PostgreSQL for integration tests
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: team_db_test
          POSTGRES_USER: test_user
          POSTGRES_PASSWORD: test_pass
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U test_user -d team_db_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      # Spin up Redis for cache integration tests
      redis:
        image: redis:7.2-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          java-version: "21"
          distribution: temurin
          cache: maven

      - name: Build and run tests
        working-directory: team-service
        env:
          # Override datasource for CI PostgreSQL service
          SPRING_DATASOURCE_URL: jdbc:postgresql://localhost:5432/team_db_test
          SPRING_DATASOURCE_USERNAME: test_user
          SPRING_DATASOURCE_PASSWORD: test_pass
          SPRING_DATA_REDIS_HOST: localhost
          SPRING_KAFKA_BOOTSTRAP_SERVERS: localhost:9092
          JWT_SECRET: ci_test_secret_32_characters_long
          SPRING_PROFILES_ACTIVE: test
        run: mvn clean verify -B

      - name: Upload JaCoCo coverage report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage-report
          path: team-service/target/site/jacoco/

      - name: Check coverage gate (80% minimum)
        working-directory: team-service
        run: mvn jacoco:check -B

  # ─────────────────────────────────────────────────────────────────
  # JOB 2 — Build Docker image and push to GHCR
  # Only runs on develop branch after tests pass
  # ─────────────────────────────────────────────────────────────────
  docker-build-push:
    name: Docker Build & Push
    runs-on: ubuntu-latest
    needs: build-and-test
    if: github.ref == 'refs/heads/develop' && github.event_name == 'push'

    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=sha,prefix=sha-
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/develop' }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: ./team-service
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha        # GitHub Actions cache for Docker layers
          cache-to: type=gha,mode=max
