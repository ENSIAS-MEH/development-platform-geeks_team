# ═══════════════════════════════════════════════════════════════════
#  Kubernetes — Team Service  |  service.yaml
#  Resource name: team-service-svc (governance §10.1)
# ═══════════════════════════════════════════════════════════════════
apiVersion: v1
kind: Service
metadata:
  name: team-service-svc          # governance §10.1
  namespace: techhub
  labels:
    app: team-service
spec:
  selector:
    app: team-service
  ports:
    - name: http
      port: 8083
      targetPort: 8083
      protocol: TCP
  type: ClusterIP                 # Internal only — exposed via Ingress (Member 3)

---
# ═══════════════════════════════════════════════════════════════════
#  Kubernetes — Team Service  |  configmap.yaml
#  Non-sensitive configuration (governance §10.1)
# ═══════════════════════════════════════════════════════════════════
apiVersion: v1
kind: ConfigMap
metadata:
  name: team-service-config       # governance §10.1
  namespace: techhub
data:
  # Database
  DB_HOST: postgres-svc
  DB_PORT: "5432"
  DB_NAME: team_db

  # Redis (governance §13.1 — Member 1 owns Redis)
  REDIS_HOST: redis-svc
  REDIS_PORT: "6379"

  # Kafka
  KAFKA_BOOTSTRAP_SERVERS: kafka-svc:9092

  # Spring
  SPRING_PROFILES_ACTIVE: k8s

---
