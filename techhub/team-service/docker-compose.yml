# ═══════════════════════════════════════════════════════════════════
#  TechHub — Docker Compose (Team Service stack)
#  Governance: doc 02 §7, §2.3, §14
#  Owner: Member 3 (SRE / Platform Lead)
#
#  Usage:
#    # Start only infrastructure (for IDE development):
#    docker compose up postgres-team redis kafka -d
#
#    # Start team-service + all its dependencies:
#    docker compose up team-service -d
#
#    # Full rebuild after code change:
#    docker compose up team-service --build --force-recreate -d
#
#    # Tail logs:
#    docker compose logs -f team-service
#
#    # Destroy everything including volumes:
#    docker compose down -v
# ═══════════════════════════════════════════════════════════════════

services:

  # ─────────────────────────────────────────────────────────────────
  # TEAM SERVICE
  # Port: 8083 (governance §2.3 — Member 3)
  # Image: techhub/team-service (governance §10.2)
  # Profile: docker (activates application-docker.yml)
  # ─────────────────────────────────────────────────────────────────
  team-service:
    # Build from local Dockerfile (relative path to the service directory)
    # Change context to . if running from inside team-service/
    build:
      context: ./team-service          # ← CHANGE to . if compose is inside team-service/
      dockerfile: Dockerfile
      # Build-time cache optimisation: re-use the deps layer across local builds
      cache_from:
        - type=local,src=/tmp/.buildx-cache
    image: techhub/team-service:latest # Tagged image name (governance §10.2)
    container_name: team-service
    restart: unless-stopped            # Restart on crash, not on explicit stop

    # ── Port mapping ──────────────────────────────────────────────
    ports:
      - "8083:8083"                    # host:container (governance §2.3)

    # ── Environment variables ─────────────────────────────────────
    # All secrets come from .env (never hardcode credentials here)
    environment:
      # Spring profile — activates application-docker.yml
      SPRING_PROFILES_ACTIVE: docker

      # Database — uses the postgres-team service defined below
      DB_HOST: postgres-team
      DB_PORT: 5432
      DB_NAME: ${TEAM_DB_NAME:-team_db}
      DB_USERNAME: ${TEAM_DB_USERNAME:-team_user}
      DB_PASSWORD: ${TEAM_DB_PASSWORD:-team_pass_local}

      # Redis — uses the shared redis service
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${REDIS_PASSWORD:-}

      # Kafka — uses the shared kafka service
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092

      # JWT — pulled from .env
      JWT_SECRET: ${JWT_SECRET}
      JWT_EXPIRATION_MS: ${JWT_EXPIRATION_MS:-86400000}

      # Server
      SERVER_PORT: 8083

      # Disable mail in local Docker (no SMTP available)
      SPRING_AUTOCONFIGURE_EXCLUDE: >-
        org.springframework.boot.autoconfigure.mail.MailAutoConfiguration

      # JVM memory — 512m container = ~384m heap (75%)
      JAVA_OPTS: >-
        -XX:+UseContainerSupport
        -XX:MaxRAMPercentage=75.0
        -XX:+UseG1GC
        -Djava.security.egd=file:/dev/./urandom

    # ── Resource limits ───────────────────────────────────────────
    # Prevents a runaway JVM from starving the host (important on laptops)
    deploy:
      resources:
        limits:
          memory: 512m
          cpus: "1.0"
        reservations:
          memory: 256m
          cpus: "0.25"

    # ── Health check ──────────────────────────────────────────────
    # Governance §14.1 — /actuator/health is mandatory
    # start_period gives Spring Boot time to initialise before
    # health failures are counted against the restart policy
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider",
                   "http://localhost:8083/api/actuator/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

    # ── Dependency ordering ───────────────────────────────────────
    # service_healthy ensures the DB is accepting connections
    # before Spring Boot attempts to run Flyway/schema.sql
    depends_on:
      postgres-team:
        condition: service_healthy
      redis:
        condition: service_healthy
      kafka:
        condition: service_healthy

    # ── Volume mounts ─────────────────────────────────────────────
    # Mount logs to host for easy access (remove in production)
    volumes:
      - team-service-logs:/app/logs

    # ── Networking ────────────────────────────────────────────────
    networks:
      - techhub-net

    # ── Logging ───────────────────────────────────────────────────
    # json-file with rotation prevents log files from filling the disk
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  # ─────────────────────────────────────────────────────────────────
  # POSTGRESQL — Team Service dedicated instance
  # Database: team_db (governance §10.3)
  # Port: 5432 (governance §2.3)
  # Owner: Member 3
  #
  # NOTE: In a shared environment all services can point to ONE
  # PostgreSQL instance with separate databases. This compose file
  # isolates team-service for standalone development.
  # ─────────────────────────────────────────────────────────────────
  postgres-team:
    image: postgres:16-alpine          # Pin to major version — never use 'latest'
    container_name: postgres-team
    restart: unless-stopped

    environment:
      POSTGRES_DB: ${TEAM_DB_NAME:-team_db}
      POSTGRES_USER: ${TEAM_DB_USERNAME:-team_user}
      POSTGRES_PASSWORD: ${TEAM_DB_PASSWORD:-team_pass_local}
      # Enable query stats for pg_stat_statements (useful for slow query analysis)
      POSTGRES_INITDB_ARGS: "--encoding=UTF8 --locale=en_US.utf8"

    ports:
      - "5433:5432"    # Expose on 5433 locally to avoid conflicts with a host PG instance
                       # ← CHANGE to 5432:5432 if no local PostgreSQL installed

    # ── Health check ──────────────────────────────────────────────
    # pg_isready exits 0 only when PG is accepting connections.
    # team-service's depends_on waits for this to pass.
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${TEAM_DB_USERNAME:-team_user} -d ${TEAM_DB_NAME:-team_db}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

    # ── Persistent volume ─────────────────────────────────────────
    # Named volume survives container restarts (docker compose down does NOT remove it)
    # Run "docker compose down -v" to wipe data
    volumes:
      - postgres-team-data:/var/lib/postgresql/data
      # Optional: mount init scripts for one-time setup
      # - ./init-db:/docker-entrypoint-initdb.d:ro

    networks:
      - techhub-net

    logging:
      driver: json-file
      options:
        max-size: "5m"
        max-file: "2"

  # ─────────────────────────────────────────────────────────────────
  # REDIS — Shared cache layer
  # Port: 6379 (governance §2.3)
  # Owner: Member 1 (governance §13.1)
  # Key prefix: techhub:team:* (governance §13.2)
  # ─────────────────────────────────────────────────────────────────
  redis:
    image: redis:7.2-alpine            # Pin to minor version
    container_name: techhub-redis
    restart: unless-stopped

    # Redis config: enable AOF persistence + disable dangerous commands
    command: >
      redis-server
      --appendonly yes
      --appendfsync everysec
      --maxmemory 128mb
      --maxmemory-policy allkeys-lru
      --rename-command FLUSHALL ""
      --rename-command FLUSHDB  ""
      --rename-command DEBUG    ""

    ports:
      - "6379:6379"

    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s

    volumes:
      - redis-data:/data

    networks:
      - techhub-net

    logging:
      driver: json-file
      options:
        max-size: "5m"
        max-file: "2"

  # ─────────────────────────────────────────────────────────────────
  # KAFKA — Event bus for team-service → notification-service events
  # Topics: team-created, team-invited, team-joined, team-full, team-left
  # Mode: KRaft (no ZooKeeper)
  # Port: 9092 (container-to-container), 9094 (host access)
  # Owner: Member 3
  # ─────────────────────────────────────────────────────────────────
  kafka:
    image: confluentinc/cp-kafka:7.6.1
    container_name: techhub-kafka
    restart: unless-stopped

    ports:
      - "9092:9092"   # INTERNAL listener — container-to-container (team-service → kafka)
      - "9094:9094"   # EXTERNAL listener — host access (IDE, kcat)

    environment:
      # ── KRaft broker identity ─────────────────────────────────────
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      CLUSTER_ID: MkU3OEVBNTcwNTJENDM2Qk
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093

      # ── Listener configuration ────────────────────────────────────
      # INTERNAL → container-to-container (team-service uses kafka:9092)
      # EXTERNAL → host machines (your IDE, kcat uses localhost:9094)
      # CONTROLLER → KRaft controller plane (not exposed externally)
      KAFKA_LISTENERS: INTERNAL://0.0.0.0:9092,EXTERNAL://0.0.0.0:9094,CONTROLLER://0.0.0.0:9093
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:9092,EXTERNAL://localhost:9094
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL

      # ── Topic defaults ────────────────────────────────────────────
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"    # Dev only — false in prod
      KAFKA_NUM_PARTITIONS: 3
      KAFKA_DEFAULT_REPLICATION_FACTOR: 1        # Single broker in dev — use 3 in prod
      KAFKA_MIN_INSYNC_REPLICAS: 1

      # ── Performance tuning ────────────────────────────────────────
      KAFKA_LOG_RETENTION_HOURS: 168             # 7 days
      KAFKA_LOG_SEGMENT_BYTES: 1073741824        # 1 GB per segment
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1

    healthcheck:
      test: ["CMD-SHELL", "kafka-topics --bootstrap-server localhost:9092 --list"]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 30s

    volumes:
      - kafka-data:/var/lib/kafka/data

    networks:
      - techhub-net

    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  # ─────────────────────────────────────────────────────────────────
  # KAFKA UI — Visual Kafka browser (dev only, no prod equivalent)
  # Port: 8090 (not in governance registry — dev tool only)
  # Access: http://localhost:8090
  # ─────────────────────────────────────────────────────────────────
  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    container_name: techhub-kafka-ui
    restart: unless-stopped

    depends_on:
      kafka:
        condition: service_healthy

    ports:
      - "8090:8080"

    environment:
      KAFKA_CLUSTERS_0_NAME: techhub-local
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:9092
      DYNAMIC_CONFIG_ENABLED: "true"

    profiles:
      - devtools    # Only started with: docker compose --profile devtools up

    networks:
      - techhub-net

  # ─────────────────────────────────────────────────────────────────
  # PROMETHEUS — Metrics collection
  # Port: 9090 (governance §2.3)
  # Owner: Member 3
  # Scrapes: /api/actuator/prometheus on team-service
  # ─────────────────────────────────────────────────────────────────
  prometheus:
    image: prom/prometheus:v2.51.0
    container_name: techhub-prometheus
    restart: unless-stopped

    ports:
      - "9090:9090"

    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus

    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=7d
      - --web.console.libraries=/usr/share/prometheus/console_libraries
      - --web.console.templates=/usr/share/prometheus/consoles
      - --web.enable-lifecycle          # POST /-/reload to reload config without restart

    depends_on:
      team-service:
        condition: service_healthy

    profiles:
      - monitoring

    networks:
      - techhub-net

  # ─────────────────────────────────────────────────────────────────
  # GRAFANA — Dashboards
  # Port: 3001 (governance §2.3)
  # Owner: Member 4 (dashboards) / Member 3 (infra)
  # ─────────────────────────────────────────────────────────────────
  grafana:
    image: grafana/grafana:10.4.0
    container_name: techhub-grafana
    restart: unless-stopped

    ports:
      - "3001:3000"

    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin_local_only   # ← change in prod
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_SERVER_ROOT_URL: http://localhost:3001

    volumes:
      - grafana-data:/var/lib/grafana
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro

    depends_on:
      - prometheus

    profiles:
      - monitoring

    networks:
      - techhub-net

# ═══════════════════════════════════════════════════════════════════
# NAMED VOLUMES
# These persist across "docker compose down" but are removed by
# "docker compose down -v"
# ═══════════════════════════════════════════════════════════════════
volumes:
  postgres-team-data:
    driver: local
  redis-data:
    driver: local
  kafka-data:
    driver: local
  team-service-logs:
    driver: local
  prometheus-data:
    driver: local
  grafana-data:
    driver: local

# ═══════════════════════════════════════════════════════════════════
# NETWORKS
# All TechHub services share a single bridge network for
# container-to-container DNS resolution by service name.
# e.g. team-service can reach postgres at hostname "postgres-team"
# ═══════════════════════════════════════════════════════════════════
networks:
  techhub-net:
    driver: bridge
    name: techhub-net      # Explicit name so other compose files can join
