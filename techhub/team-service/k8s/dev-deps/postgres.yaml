apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: postgres-team-pvc
  namespace: techhub
spec:
  accessModes: [ReadWriteOnce]
  resources:
    requests:
      storage: 1Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: postgres-team
  namespace: techhub
  labels:
    app: postgres-team
spec:
  replicas: 1
  selector:
    matchLabels:
      app: postgres-team
  template:
    metadata:
      labels:
        app: postgres-team
    spec:
      containers:
        - name: postgres
          image: postgres:16-alpine
          ports:
            - containerPort: 5432
          env:
            - name: POSTGRES_DB
              value: "team_db"
            - name: POSTGRES_USER
              value: "team_user"
            - name: POSTGRES_PASSWORD
              value: "team_pass_local"
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"
          readinessProbe:
            exec:
              command: ["pg_isready", "-U", "team_user", "-d", "team_db"]
            initialDelaySeconds: 10
            periodSeconds: 5
          volumeMounts:
            - name: postgres-data
              mountPath: /var/lib/postgresql/data
      volumes:
        - name: postgres-data
          persistentVolumeClaim:
            claimName: postgres-team-pvc
---
apiVersion: v1
kind: Service
metadata:
  name: postgres-team
  namespace: techhub
  labels:
    app: postgres-team
spec:
  type: ClusterIP
  selector:
    app: postgres-team
  ports:
    - port: 5432
      targetPort: 5432
