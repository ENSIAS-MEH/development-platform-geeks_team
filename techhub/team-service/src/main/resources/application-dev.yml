# ════════════════════════════════════════════════
#  application-dev.yml  — local development overrides
# ════════════════════════════════════════════════

spring:
  jpa:
    show-sql: true
    hibernate:
      ddl-auto: create-drop             # reset schema on restart during dev

  sql:
    init:
      mode: always

server:
  error:
    include-message: always             # show errors in dev
    include-stacktrace: on_param

logging:
  level:
    com.techhub.teamservice: DEBUG
    org.hibernate.SQL: DEBUG
    org.hibernate.type.descriptor.sql: TRACE
