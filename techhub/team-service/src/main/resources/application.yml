# ════════════════════════════════════════════════
#  TechHub — Team Service
#  application.yml  (base / common config)
# ════════════════════════════════════════════════

spring:

  application:
    name: team-service

  # Disable mail auto-configuration in local dev (we don't send emails from local)
  autoconfigure:
    exclude:
      - org.springframework.boot.autoconfigure.mail.MailAutoConfiguration

  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}

  # ── PostgreSQL + HikariCP ──────────────────────
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:team_db}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver

    hikari:
      # Pool sizing — tuned for microservice workload
      minimum-idle: 5
      maximum-pool-size: 20
      idle-timeout: 300000          # 5 min
      connection-timeout: 20000     # 20 s
      max-lifetime: 1200000         # 20 min
      keepalive-time: 60000         # 1 min
      pool-name: TeamServiceHikariPool
      # Diagnostics
      leak-detection-threshold: 15000
      # PostgreSQL tuning
      data-source-properties:
        cachePrepStmts: true
        prepStmtCacheSize: 250
        prepStmtCacheSqlLimit: 2048
        useServerPrepStmts: true

  # ── JPA / Hibernate ───────────────────────────
  jpa:
    hibernate:
      ddl-auto: validate                 # schema.sql owns DDL — never let Hibernate drift it
    show-sql: false                      # override to true in dev profile only
    open-in-view: false                  # prevent accidental lazy-load anti-pattern
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
        use_sql_comments: true
        jdbc:
          batch_size: 25
          order_inserts: true
          order_updates: true
        cache:
          use_second_level_cache: true
          use_query_cache: true
          region:
            factory_class: org.redisson.hibernate.RedissonRegionFactory

  # ── SQL initialization ────────────────────────
  sql:
    init:
      mode: always
      schema-locations: classpath:schema.sql
      data-locations: classpath:data.sql
      encoding: UTF-8

  # ── Redis (second-level cache + session store) ─
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      timeout: 2000ms
      connect-timeout: 1000ms
      lettuce:
        pool:
          enabled: true
          max-active: 16
          max-idle: 8
          min-idle: 2
          max-wait: 1000ms
          time-between-eviction-runs: 30s
      # Key expiry defaults (seconds)
      default-ttl: 3600             # 1 hour

  # ── Kafka ──────────────────────────────────────
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
      acks: all                          # strongest durability guarantee
      retries: 3
      properties:
        enable.idempotence: true
        max.in.flight.requests.per.connection: 1
        spring.json.add.type.headers: false
    consumer:
      group-id: team-service-group
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.JsonDeserializer
      properties:
        spring.json.trusted.packages: "com.techhub.*"
    # Topic definitions (auto-created in dev; pre-created in prod)
    topics:
      team-created: team-created
      team-invited: team-invited
      team-joined: team-joined
      team-full: team-full
      team-left: team-left

  # ── Mail (invitation emails via Notification Service) ──
  mail:
    host: ${MAIL_HOST:smtp.gmail.com}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
            required: true
        debug: false

  # ── Scheduling ────────────────────────────────
  task:
    scheduling:
      pool:
        size: 4

# ── Server ─────────────────────────────────────
server:
  port: ${SERVER_PORT:8083}
  servlet:
    context-path: /api
  error:
    include-message: never              # never leak stack traces
    include-binding-errors: never
    include-stacktrace: never
    include-exception: false
  compression:
    enabled: true
    mime-types: application/json,text/plain
    min-response-size: 1024

# ── Actuator ───────────────────────────────────
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
      base-path: /actuator
  endpoint:
    health:
      show-details: when-authorized
  metrics:
    export:
      prometheus:
        enabled: true

# ── JWT (shared secret pulled from env/vault) ──
security:
  jwt:
    # Local dev placeholder 32-char secret (DO NOT USE IN PRODUCTION)
    secret: ${JWT_SECRET:0123456789ABCDEF0123456789ABCDEF}
    expiration-ms: ${JWT_EXPIRATION_MS:86400000}   # 24 h

# ── Custom app properties ──────────────────────
app:
  invitation:
    expiry-hours: 48
    scheduler-rate-ms: 60000           # run every 60 s
  team:
    default-max-members: 10
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000}

# ── Logging ────────────────────────────────────
logging:
  level:
    root: INFO
    com.techhub.teamservice: DEBUG
    org.springframework.security: WARN
    org.hibernate.SQL: WARN
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n"
