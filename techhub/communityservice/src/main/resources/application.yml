# ═══════════════════════════════════════════════════════════════════════
#  TechHub Community Service – application.yml
#  Port 8085 • Database: community_db
# ═══════════════════════════════════════════════════════════════════════

server:
  port: 8085

spring:
  application:
    name: community-service

  # ── PostgreSQL ──────────────────────────────────────────────────────
  datasource:
    url: jdbc:postgresql://127.0.0.1:5435/community_db
    username: ${DB_USERNAME:postgres}
    password: postgres
    driver-class-name: org.postgresql.Driver

  # ── JPA / Hibernate ────────────────────────────────────────────────
  jpa:
    hibernate:
      ddl-auto: validate          # Flyway manages the schema
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true

  # ── Flyway ─────────────────────────────────────────────────────────
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

  # ── Redis ──────────────────────────────────────────────────────────
  data:
    redis:
      host: ${REDIS_HOST:127.0.0.1}
      port: ${REDIS_PORT:6379}

  # ── Cache ──────────────────────────────────────────────────────────
  cache:
    type: redis

# ── Swagger / OpenAPI ──────────────────────────────────────────────────
springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html

# ── Actuator ───────────────────────────────────────────────────────────
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
